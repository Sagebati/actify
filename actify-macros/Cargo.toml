[package]
name = "actify-macros"
version = "0.6.0"
description = "Actify's procedural macros"
documentation = "https://docs.rs/actify-macros/latest/actify_macros/"
readme = "README.md"
keywords = ["actor", "async", "macro", "proc-macro", "tokio"]
categories = ["asynchronous", "development-tools::procedural-macro-helpers"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
proc-macro2.workspace = true
quote.workspace = true
syn.workspace = true

[features]
default = []
# Emits `Handle::new` on every generated handle. actify turns this on with its
# own `tokio` feature, which is what `Handle::new` needs to spawn with.
tokio = []

[lib]
proc-macro = true
