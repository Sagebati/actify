[package]
name = "actify-test"
version = "0.1.0"
description = "Actify testing crate"
publish = false
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
actify = { path = "../actify" }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true, features = ["std", "attributes"] }

[dev-dependencies]
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
trybuild.workspace = true
# trybuild builds the compile-fail cases in a generated crate that takes its
# tokio features from this section, not from [dependencies]. `macros` is what
# `#[tokio::main]` in those cases needs; actify no longer enables it, since its
# own dependency on tokio is optional.
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
flume = { version = "0.12.0", default-features = false, features = ["async"] }
tokio-util = "0.7.19"
tokio-stream = "0.1.19"
futures-executor = "0.3.34"

[features]
default = []
