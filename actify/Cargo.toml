[package]
name = "actify"
version = "0.9.0"
description = "An intuitive actor model with minimal boilerplate"
documentation = "https://docs.rs/actify/latest/actify/"
readme = "../README.md"
keywords = ["actor", "async", "tokio", "concurrency", "macro"]
categories = ["asynchronous", "concurrency"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
tokio = { workspace = true, features = ["rt"], optional = true }
futures-core = { workspace = true, features = ["std"] }
futures-sink = { workspace = true, features = ["std"] }
futures-channel = { workspace = true, features = ["std", "sink"] }
tracing = { workspace = true, features = ["std"] }
actify-macros.workspace = true

[dev-dependencies]
futures-executor = "0.3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }

[features]
default = ["tokio"]
# `Handle::new`, which builds an actor and spawns it on Tokio in one call.
# Without it the caller spawns the actor future itself, on any executor.
tokio = ["dep:tokio"]
# Emits the events as log records whenever no tracing subscriber is set.
log = ["tracing/log"]
