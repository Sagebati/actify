[package]
name = "actum-test"
version = "0.1.0"
description = "Actum testing crate"
publish = false
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
actum = { path = "../actum" }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true, features = ["std", "attributes"] }

[dev-dependencies]
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
# The allocation tests count with this rather than a hand-rolled GlobalAlloc.
# Its counters are process-wide, which is the requirement: a blocking actor
# runs on its own thread, and a thread-local counter would not see it.
stats_alloc = "0.1.10"
futures-channel = "0.3"
trybuild.workspace = true
# trybuild builds the compile-fail cases in a generated crate that takes its
# tokio features from this section, not from [dependencies]. `macros` is what
# `#[tokio::main]` in those cases needs; actum no longer enables it, since its
# own dependency on tokio is optional.
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
flume = { version = "0.12.0", default-features = false, features = ["async"] }
tokio-util = "0.7.19"
tokio-stream = "0.1.19"
futures-executor = "0.3.34"

[features]
default = []
