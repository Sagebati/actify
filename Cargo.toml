[workspace]

resolver = "3"
members = [
    "actify",
    "actify-macros",
    "actify-test",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/AvalorAI/actify"

[workspace.dependencies]
# actify requires the exact macro version it was built against: generated code
# reaches into actify::__private, which carries no stability promise.
actify-macros = { path = "actify-macros", version = "=0.6.0" }
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full"] }
tokio = { version = "1.44.1", default-features = false }
futures-core = { version = "0.3", default-features = false }
futures-sink = { version = "0.3", default-features = false }
futures-channel = { version = "0.3", default-features = false }
# The blocking backend's reply channel. `std` gives the parking `recv`; the
# wait-free `try_recv` the spinning caller uses needs no feature at all, and
# `async` is deliberately off, since a blocking handle's methods never await.
oneshot = { version = "0.2.1", default-features = false, features = ["std"] }
tracing = { version = "0.1", default-features = false }
trybuild = "1"
